<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Shield Primary Cyber Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Inner Core Healing Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Cyber Grid Subtle Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Outer Protective Shield Aura -->
  <path d="M256 68 C352 68 408 108 408 108 C408 248 356 364 256 428 C156 364 104 248 104 108 C104 108 160 68 256 68 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"
        opacity="0.85"/>

  <!-- Inner Protective Shield Geometry -->
  <path d="M256 86 C336 86 384 122 384 122 C384 238 340 340 256 398 C172 340 128 238 128 122 C128 122 176 86 256 86 Z" 
        fill="#0f172a" 
        fill-opacity="0.9"
        stroke="#1e293b" 
        stroke-width="4"
        filter="url(#dropShadow)"/>

  <!-- Autonomous Healing Core (Neural Lightning Bolt & Dynamic Pulse) -->
  <g filter="url(#neonGlow)">
    <!-- Circuit Connection Nodes -->
    <circle cx="256" cy="120" r="7" fill="#38bdf8"/>
    <circle cx="340" cy="170" r="5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="172" cy="170" r="5" fill="#38bdf8" opacity="0.8"/>
    <line x1="172" y1="170" x2="256" y2="120" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,4"/>
    <line x1="340" y1="170" x2="256" y2="120" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,4"/>

    <!-- Central Healing Bolt / Checkmark Fusion -->
    <path d="M272 136 L184 260 L248 260 L224 372 L328 236 L264 236 L288 136 Z" 
          fill="url(#coreGrad)"/>

    <!-- Validation Checkmark Accent (Green Emerald) -->
    <path d="M192 268 L232 308 L320 200" 
          fill="none" 
          stroke="#10b981" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)"/>
  </g>

  <!-- Glowing Focal Dots -->
  <circle cx="256" cy="398" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="128" cy="122" r="4" fill="#818cf8"/>
  <circle cx="384" cy="122" r="4" fill="#818cf8"/>
</svg>
