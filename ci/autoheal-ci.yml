name: AutoHeal CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-heal:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Build TypeScript
      run: npm run build

    - name: Run AutoHeal Test Agent
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        node dist/cli.js run --no-pr

    - name: Upload AutoHeal HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: autoheal-report
        path: autoheal-report.html
